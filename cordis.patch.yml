# dsh-cookie-sync bundle patch: mount the plugin row.
#
# Override any option under config: (see index.js).
- insert:
    - id: cookie-sync
      name: dsh-cookie-sync
      config:
        autoSyncDomains:
          - github.com
          - raw.githubusercontent.com
          - api.github.com
        maxCookiesPerDomain: 50
